<style>
  :root {
    --blue: #0C2749;
    --red: #AA1120;
    --cream: #f7f5ee;
    --ink: #232323;
    --sky: #A3D4F2;
    --line: #d9d5c7;
    --muted: #4f5666;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--cream); color: var(--ink); font: 16px/1.5 var(--sans); }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  .top { background: var(--blue); color: #fff; padding: 20px 20px 18px; border-bottom: 4px solid var(--red); }
  .top h1 { margin: 0; font: 600 1.75rem/1.1 var(--serif); }
  .eyebrow { margin: 0 0 4px; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--sky); }

  main { max-width: 720px; margin: 0 auto; padding: 8px 20px 48px; }
  .panel { padding: 24px 0; border-bottom: 1px solid var(--line); }
  .panel h2 { margin: 0 0 16px; font: 600 1.25rem/1.2 var(--serif); color: var(--blue); }
  .num { display: inline-block; min-width: 2.2em; font: 600 .8rem/1 var(--sans); letter-spacing: .08em; color: var(--red); vertical-align: middle; }

  .alert { max-width: 720px; margin: 16px auto 0; padding: 12px 16px; border-left: 4px solid var(--red); background: #fff; color: var(--ink); }
  .alert strong { color: var(--red); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-weight: 600; margin-bottom: 4px; }
  .hint { font-weight: 400; color: var(--muted); }
  .req { color: var(--red); }
  input, textarea { width: 100%; font: inherit; font-size: 1.0625rem; color: var(--ink); background: #fff; border: 1.5px solid #6b7280; border-radius: 4px; padding: 10px 12px; }
  textarea { resize: vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .row-3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
  @media (max-width: 380px) { .row-3 { grid-template-columns: 1fr 1fr; } .row-3 .field:first-child { grid-column: 1 / -1; } }

  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; font: 600 1rem var(--sans); border-radius: 4px; cursor: pointer; border: 2px solid var(--blue); }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: #163a66; }
  .btn-primary[disabled] { opacity: .65; cursor: progress; }
  .btn-quiet { background: #fff; color: var(--blue); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 8px; }
  .form-error { color: var(--red); font-weight: 600; min-height: 1.5em; margin: 4px 0 12px; }
  .small { font-size: .9rem; color: var(--muted); word-break: break-all; }
  .small a { color: var(--blue); }

  .result-address { font: 600 1.1rem var(--serif); margin: 0 0 12px; }
  .qr-preview { width: 220px; max-width: 100%; background: #fff; padding: 8px; border: 1px solid var(--line); }
  .qr-preview svg { display: block; width: 100%; height: auto; }

  .past-list { list-style: none; margin: 0; padding: 0; }
  .past-list li { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); }
  .past-list li:first-child { border-top: 0; }
  .past-meta { min-width: 0; }
  .past-address { font-weight: 600; overflow-wrap: anywhere; }
  .past-sub { font-size: .875rem; color: var(--muted); }
  .badge { display: inline-block; margin-left: 6px; padding: 1px 6px; font-size: .75rem; border: 1px solid var(--muted); border-radius: 3px; color: var(--muted); }
  .past-list .btn { flex: none; min-height: 44px; padding: 0 14px; }

  /* Print preview toolbar (screen only). The sheet itself is styled by PrintStyles.html. */
  .print-toolbar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--line); }
  body.printing .admin-ui { display: none; }
</style>
